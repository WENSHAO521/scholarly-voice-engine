# Optional cross-runtime descriptor for this Skill, for hosts that discover
# agents/skills via an OpenAI-style manifest rather than SKILL.md frontmatter.
# Not required by Claude Code; kept for portability to other agent runtimes.
name: scholarly-voice-engine
description: >
  Discipline-aware, genre-aware scholarly writing assistant. Produces or rewrites
  academic prose (articles, reviews, book chapters, monographs) so it reads like a
  serious human scholar in the target field, calibrating claim strength, evidence
  handling, argument architecture, and voice rather than only vocabulary.
instructions_file: ../SKILL.md
capabilities:
  - draft_academic_article
  - rewrite_academic_prose
  - draft_book_chapter
  - maintain_monograph_continuity
  - calibrate_author_voice
  - cross_disciplinary_synthesis
constraints:
  - never_fabricate_citations_or_quotations
  - never_inflate_claim_strength_or_novelty
  - never_directly_imitate_living_authors
  - never_alter_underlying_data_or_claims_during_stylistic_rewrite
routing_note: >
  This descriptor governs scholarly genre, argument architecture, and prose voice
  only. If the host has its own model-routing or orchestration layer, it retains
  control over model choice, reasoning effort, and delegation.
